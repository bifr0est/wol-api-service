name: Build and Push WoL API

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:act-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          config-inline: |
            [registry."10.0.6.48:3000"]
              http = true
              insecure = true
      
      - name: Login to Gitea Container Registry
        run: |
          echo "${{ secrets.giteapassword }}" | docker login 10.0.6.48:3000 -u "${{ secrets.giteausername }}" --password-stdin
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            10.0.6.48:3000/bifroest/wol-api-service:latest
            10.0.6.48:3000/bifroest/wol-api-service:${{ github.sha }}
          cache-from: type=registry,ref=10.0.6.48:3000/bifroest/wol-api-service:latest
          cache-to: type=inline
      
      - name: Display success message
        if: success()
        run: |
          echo "✅ Docker image built and pushed successfully!"
          echo ""
          echo "Pull with:"
          echo "  docker pull 10.0.6.48:3000/bifroest/wol-api-service:latest"
