name: Build and Push WoL API

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:act-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up buildx with insecure registry
        run: |
          cat > buildkitd.toml << EOF
          [registry."10.0.6.48:3000"]
            http = true
            insecure = true
          EOF
          
          docker buildx create --name insecure-builder --config ./buildkitd.toml --use --bootstrap
      
      - name: Login to registry (for buildx)
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.giteapassword }}" | docker login 10.0.6.48:3000 -u "${{ secrets.giteausername }}" --password-stdin || true
      
      - name: Build and push Docker image with buildx
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            docker buildx build \
              -t 10.0.6.48:3000/bifroest/wol-api-service:latest \
              -t 10.0.6.48:3000/bifroest/wol-api-service:${{ github.sha }} \
              --push .
          else
            docker buildx build \
              -t 10.0.6.48:3000/bifroest/wol-api-service:latest \
              .
          fi
      
      - name: Display success message
        if: success()
        run: |
          echo "✅ Docker image built and pushed successfully!"
          echo ""
          echo "Pull with:"
          echo "  docker pull 10.0.6.48:3000/bifroest/wol-api-service:latest"
